---
- name: Configure host
  hosts: all

  vars_files:
    - config.yml

  tasks:
    - name: Set hostname
      become: true
      ansible.builtin.hostname:
        name: "{{ username }}-laptop"
        use: systemd

    - import_tasks: tasks/packages.yml
      when: configure_packages
      tags: ["packages"]

    - import_tasks: tasks/development.yml
      when: configure_development
      tags: ["development"]

    - import_tasks: tasks/theme.yml
      when: configure_theme
      tags: ["theme"]

    - import_tasks: tasks/services.yml
      when: configure_services
      tags: ["services"]
