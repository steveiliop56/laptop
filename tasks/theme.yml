---
- name: Clone Grub theme
  become: true
  ansible.builtin.git:
    repo: https://github.com/vinceliuice/Elegant-grub2-themes.git
    dest: /tmp/elegant-grub2-themes

- name: Install Grub theme
  become: true
  ansible.builtin.command: bash install.sh -t forest -p sharp -i right -c dark -s 2k -b
  args:
    chdir: /tmp/elegant-grub2-themes
    creates: /boot/grub2/themes/Elegant-forest-sharp-right-dark/theme.txt

- name: Clone Tela icon theme
  ansible.builtin.git:
    repo: https://github.com/vinceliuice/Tela-icon-theme.git
    dest: /tmp/tela-icon-theme

- name: Install Tela icon theme
  ansible.builtin.command: bash install.sh
  args:
    chdir: /tmp/tela-icon-theme
    creates: /home/{{ username }}/.local/share/icons/Tela/index.theme

- name: Set Ghostty theme
  ansible.builtin.lineinfile:
    path: "/home/{{ username }}/.config/ghostty/config"
    regexp: "^theme\\s*="
    line: "theme = Dark+"
    create: true
    state: present

- name: Set oh-my-bash theme
  ansible.builtin.lineinfile:
    path: "/home/{{ username }}/.bashrc"
    regexp: "^OSH_THEME="
    line: 'OSH_THEME="pure"'
    create: true
    state: present

- name: Set Tela icon theme as default
  community.general.dconf:
    key: "/org/gnome/desktop/interface/icon-theme"
    value: "'Tela'"

- name: Set screenshot keybind
  community.general.dconf:
    key: "/org/gnome/shell/keybindings/show-screenshot-ui"
    value: "['<Shift><Super>s']"

- name: Enable maximized and minimize buttons
  community.general.dconf:
    key: "/org/gnome/desktop/wm/preferences/button-layout"
    value: "'appmenu:minimize,maximize,close'"

- name: Set sources
  community.general.dconf:
    key: "/org/gnome/desktop/input-sources/sources"
    value: "[('xkb', 'us'), ('xkb', 'gr')]"

- name: Set language change method
  community.general.dconf:
    key: "/org/gnome/desktop/input-sources/xkb-options"
    value: "['grp:alt_shift_toggle']"

- name: Always show accesibility menu
  community.general.dconf:
    key: "/org/gnome/desktop/a11y/always-show-universal-access-status"
    value: true
