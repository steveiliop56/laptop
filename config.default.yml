---
# Base username
username: stavros

# What to configure
# Installs every app that I use daily
configure_packages: true

# Install my development tools
configure_development: true

# QoL improvements and customization
configure_theme: true

# Enable the newly installed services
configure_services: true

# Developer options
# JetBrains toolbox version to install
jetbrains_toolbox_version: 3.8.1.88030

# Go version to install
go_version: 1.27.2

# NVM version to install
nvm_version: 0.40.8

# Node version to install
node_version: stable

# PNPM version to install
pnpm_version: 11.1.2

# Go tools to install
go_tools:
  - github.com/air-verse/air@v1.67.4
  - github.com/go-delve/delve/cmd/dlv@v1.27.2
  - github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1
  - sigs.k8s.io/controller-tools/cmd/controller-gen@v0.22.0
  - github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
  - github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2

# Other options
# Tailscale authentication key
tailscale_auth_key: ""

# Wakatime configuration
wakatime_api_url: ""
wakatime_api_key: ""
